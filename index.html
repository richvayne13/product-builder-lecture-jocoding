<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-4176438580280521">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4176438580280521"
     crossorigin="anonymous"></script>
</head>
<body>
    <div id="app">
        <div class="theme-toggle">
            <button id="theme-btn" title="Toggle Dark/Light Mode">🌓</button>
        </div>
        <div class="timer-container">
            <svg class="timer-svg" width="300" height="300" viewBox="0 0 300 300">
                <circle class="timer-background" cx="150" cy="150" r="140"/>
                <circle class="timer-progress" cx="150" cy="150" r="140"/>
                <g class="timer-ticks">
                    <!-- Ticks will be generated by JavaScript -->
                </g>
                <text class="time-left" x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">25:00</text>
            </svg>
        </div>
        <div class="controls">
            <button id="start-btn">Start</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>
        <div class="settings">
            <label for="color-picker">Choose Timer Color:</label>
            <input type="color" id="color-picker" value="#ff6347">
        </div>
        <div class="timer-modes">
            <button class="mode-btn active" data-time="1500">Pomodoro</button>
            <button class="mode-btn" data-time="300">Short Break</button>
            <button class="mode-btn" data-time="900">Long Break</button>
        </div>
        <div class="duration-control">
            <label for="duration-slider">Set Duration: <span id="duration-value">25</span> min</label>
            <input type="range" id="duration-slider" min="5" max="60" step="5" value="25">
        </div>

        <div class="contact-section">
            <h3>Affiliate Inquiry</h3>
            <form action="https://formspree.io/f/xgolnnzy" method="POST" id="contact-form">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="How can we help?" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>

        <div class="comments-section">
            <div id="disqus_thread"></div>
            <script>
                /**

                s.src = 'https://productbuilder-elj5rdryei.disqus.com/embed.js';

                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </div>
    </div>
    <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>
    <script src="main.js"></script>
</body>
