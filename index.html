<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="theme-toggle">
            <button id="theme-btn" title="Toggle Dark/Light Mode">🌓</button>
        </div>
        <div class="timer-container">
            <svg class="timer-svg" width="300" height="300" viewBox="0 0 300 300">
                <circle class="timer-background" cx="150" cy="150" r="140"/>
                <circle class="timer-progress" cx="150" cy="150" r="140"/>
                <g class="timer-ticks">
                    <!-- Ticks will be generated by JavaScript -->
                </g>
                <text class="time-left" x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">25:00</text>
            </svg>
        </div>
        <div class="controls">
            <button id="start-btn">Start</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>
        <div class="settings">
            <label for="color-picker">Choose Timer Color:</label>
            <input type="color" id="color-picker" value="#ff6347">
        </div>
        <div class="timer-modes">
            <button class="mode-btn active" data-time="1500">Pomodoro</button>
            <button class="mode-btn" data-time="300">Short Break</button>
            <button class="mode-btn" data-time="900">Long Break</button>
        </div>
        <div class="duration-control">
            <label for="duration-slider">Set Duration: <span id="duration-value">25</span> min</label>
            <input type="range" id="duration-slider" min="5" max="60" step="5" value="25">
        </div>
    </div>
    <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>
    <script src="main.js"></script>
</body>
</html>
